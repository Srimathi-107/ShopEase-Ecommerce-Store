
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEase | Discover Your Style</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

<nav class="navbar navbar-expand-lg bg-white sticky-top shadow-sm py-3">
  <div class="container-fluid px-lg-5">
    <a class="navbar-brand fw-bold fs-2 text-dark" href="#">
      Shop<span class="text-primary">Ease.</span>
    </a>

    <div class="d-flex align-items-center gap-3 justify-content-center flex-md-nowrap flex-lg-nowrap ">
        <div class="input-group">
            <input type="search" id="searchbox" class="form-control bg-light border-0" placeholder="Search products...">
            <button class="btn btn-primary px-3" id="search" type="button">
                <i class="ri-search-line"></i>
            </button>
        </div>
        <button class="btn btn-light rounded-circle position-relative" id="carticon" aria-label="Open cart">
          <i class="ri-shopping-bag-3-line fs-5"></i>
          <span id="cartcount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-primary">0</span>
        </button>
  
        <button class="btn btn-light rounded-circle position-relative" id="wishlist" aria-label="Open wishlist">
          <i class="ri-heart-3-line fs-5 text-danger"></i>
          <span id="wishcount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
        </button>
    </div>
  </div>
</nav>

<header class="container-fluid px-lg-5 py-4">
  <div class="bg-primary text-white rounded-4 p-4 p-md-5 shadow-sm">
    <div class="row align-items-center g-4">
      <div class="col-lg-7">
        <span class="badge bg-white text-primary rounded-pill px-3 py-2 mb-3">YOUR EVERYDAY MARKETPLACE</span>
        <h1 class="display-4 fw-bold">Find your next<br>favourite thing.</h1>
        <p class="lead opacity-75">Discover products you'll love, all in one place.</p>
        <a href="#products" class="btn btn-light btn-lg rounded-pill px-4 fw-semibold text-primary">
          Explore Collection <i class="ri-arrow-right-line"></i>
        </a>
      </div>
      <div class="col-lg-5 text-center">
        <i class="ri-shopping-bag-3-fill" style="font-size:150px"></i>
      </div>
    </div>
  </div>
</header>

<main class="container-fluid px-lg-5 pb-5" id="products">

  <div class="d-flex justify-content-between align-items-end flex-wrap gap-3 mb-4">
    <div>
      <p class="text-primary fw-semibold mb-1">HANDPICKED FOR YOU</p>
      <h2 class="fw-bold mb-1">Explore Products</h2>
      <p class="text-secondary mb-0">Find something special today.</p>
    </div>

    <div class="d-flex flex-wrap gap-2">
      <button id="lh" class="btn btn-outline-primary rounded-pill">
        <i class="ri-sort-asc"></i> Price: Low–High
      </button>
      <button id="hl" class="btn btn-outline-primary rounded-pill">
        <i class="ri-sort-desc"></i> Price: High–Low
      </button>
    </div>
  </div>

  <div class="d-flex flex-wrap gap-2 mb-4">
    <button id="all" class="btn btn-primary rounded-pill px-4">All Products</button>
    <button id="beauty" class="btn btn-white bg-white border rounded-pill px-4">Beauty</button>
    <button id="grocery" class="btn btn-white bg-white border rounded-pill px-4">Grocery</button>
    <button id="fragrances" class="btn btn-white bg-white border rounded-pill px-4">Fragrances</button>
    <button id="furniture" class="btn btn-white bg-white border rounded-pill px-4">Furniture</button>
  </div>

  <div id="product-container" class="row g-4"></div>

</main>

<div class="offcanvas offcanvas-end" tabindex="-1" id="cartmenu" aria-labelledby="cartTitle">
  <div class="offcanvas-header border-bottom p-4">
    <h5 class="offcanvas-title fw-bold" id="cartTitle">
      <i class="ri-shopping-bag-3-line text-primary"></i> Your Shopping Bag
    </h5>
    <button class="btn-close" id="btn2" aria-label="Close"></button>
  </div>
  <div id="items" class="offcanvas-body d-flex flex-column gap-3"></div>
  <div class="border-top p-3 d-flex flex-column gap-2">
    <button id="btn1" class="btn btn-primary btn-lg w-100">Total: $ 0</button>
    <button id="btn3" class="btn btn-outline-danger w-100">Clear Cart</button>
  </div>
</div>

<div class="offcanvas offcanvas-end" tabindex="-1" id="wishmenu" aria-labelledby="wishTitle">
  <div class="offcanvas-header border-bottom p-4">
    <h5 class="offcanvas-title fw-bold" id="wishTitle">
      <i class="ri-heart-3-line text-danger"></i> Your Wishlist
    </h5>
    <button class="btn-close" id="wishclose" aria-label="Close"></button>
  </div>
  <div id="itemswish" class="offcanvas-body d-flex flex-column gap-3"></div>
</div>

<footer class="bg-white border-top py-4">
  <div class="container-fluid px-lg-5 d-flex justify-content-between flex-wrap gap-2">
    <span class="fw-bold">Shop<span class="text-primary">Ease.</span></span>
    <span class="text-secondary small">Discover more. Shop better.</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script src="main.js"></script>

<script>
  let category = document.getElementById("category");
  let lh = document.getElementById("lh");
  let hl = document.getElementById("hl");
  let all = document.getElementById("all");
  let fragrances = document.getElementById("fragrances");
  let beauty = document.getElementById("beauty");
  let grocery = document.getElementById("grocery");
  let furniture = document.getElementById("furniture");

  let cartmenu = document.getElementById("cartmenu");
  let wishmenu = document.getElementById("wishmenu");

  let cartPanel = bootstrap.Offcanvas.getOrCreateInstance(cartmenu);
  let wishPanel = bootstrap.Offcanvas.getOrCreateInstance(wishmenu);

  document.getElementById("carticon").addEventListener("click", () => {
    cartPanel.toggle();
  });

  document.getElementById("btn2").addEventListener("click", () => {
    cartPanel.hide();
  });

  document.getElementById("wishlist").addEventListener("click", () => {
    wishPanel.toggle();
  });

  document.getElementById("wishclose").addEventListener("click", () => {
    wishPanel.hide();
  });

  let items = document.getElementById("items");
  let itemswish = document.getElementById("itemswish");
  let btn1 = document.getElementById("btn1");

  document.getElementById("btn3").addEventListener("click", () => {
    cartarr.forEach((d) => {
      cartarr = cartarr.filter((e) => e.id !== d.id);
    });
    cararr = [];
    cartfunc();
    localStorage.setItem("cart", JSON.stringify(cartarr));
    notifycart();
  });

  let cartarr = JSON.parse(localStorage.getItem("cart")) || [];
  let wisharr = JSON.parse(localStorage.getItem("wish")) || [];
  let cartcount = document.getElementById("cartcount");
  let wishcount = document.getElementById("wishcount");
  let searchbox = document.getElementById("searchbox");

  searchbox.addEventListener("input", () => {
    let check = searchbox.value.toLowerCase();
    let filter = product.filter((u) =>
      u.title.toLowerCase().includes(check)
    );
    uimain(filter);
  });

  function categoryfilter(cat) {
    if (cat === "all") {
      uimain(product);
      return;
    }

    let filtercat = product.filter((e) => e.category === cat);
    uimain(filtercat);
  }

  all.onclick = () => categoryfilter("all");
  beauty.onclick = () => categoryfilter("beauty");
  grocery.onclick = () => categoryfilter("groceries");
  furniture.onclick = () => categoryfilter("furniture");
  fragrances.onclick = () => categoryfilter("fragrances");

  lh.addEventListener("click", () => {
    product.sort((a, b) => a.price - b.price);
    uimain(product);
  });

  hl.addEventListener("click", () => {
    product.sort((a, b) => b.price - a.price);
    uimain(product);
  });
</script>
</body>
</html>
